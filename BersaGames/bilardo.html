<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>8-Ball Bilardo Oyunu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-action {
            transition: transform 0.1s ease, filter 0.1s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .btn-action:active {
            transform: scale(0.95);
            filter: brightness(1.2);
        }
        .glow-gold { box-shadow: 0 0 20px rgba(234, 179, 8, 0.5); }
        .glow-cyan { box-shadow: 0 0 20px rgba(6, 182, 212, 0.5); }
    </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden bg-slate-950 text-white select-none">

    <div id="gameContainer" class="relative w-full h-full flex items-center justify-center overflow-hidden">
        
        <!-- Game Canvas -->
        <canvas id="poolCanvas"></canvas>

        <!-- Top In-Game Scoreboard & HUD -->
        <div id="gameHUD" class="absolute top-2 left-0 right-0 px-4 flex justify-between items-center pointer-events-none hidden z-20">
            <!-- Player Status -->
            <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-3 border-emerald-500/30">
                <div class="w-10 h-10 rounded-full bg-emerald-500/20 border border-emerald-400 flex items-center justify-center font-black text-emerald-400 text-sm">
                    SEN
                </div>
                <div>
                    <div class="text-xs text-slate-400 font-bold">TOP TİPİ</div>
                    <div id="playerBallGroupText" class="text-sm font-black text-emerald-400">SERBEST</div>
                </div>
            </div>

            <!-- Money & Turn Info -->
            <div class="glass-panel px-6 py-2 rounded-2xl flex flex-col items-center border-amber-500/30">
                <div id="turnStatusText" class="text-sm font-black text-amber-400 tracking-wide">SENİN SIRA-NI BEKLE</div>
                <div class="flex items-center gap-1.5 text-xs text-amber-300 font-bold mt-0.5">
                    <svg class="w-4 h-4 fill-amber-400" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
                     Bakiye: $<span id="hudMoneyText">0</span>
                </div>
            </div>

            <!-- Bot Status -->
            <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-3 border-rose-500/30">
                <div class="text-right">
                    <div class="text-xs text-slate-400 font-bold">TOP TİPİ</div>
                    <div id="botBallGroupText" class="text-sm font-black text-rose-400">SERBEST</div>
                </div>
                <div class="w-10 h-10 rounded-full bg-rose-500/20 border border-rose-400 flex items-center justify-center font-black text-rose-400 text-sm">
                    BOT
                </div>
            </div>
        </div>

        <!-- Cue Power Bar (Mobile/Right side) -->
        <div id="powerBarContainer" class="absolute right-4 top-1/2 -translate-y-1/2 w-8 h-64 glass-panel rounded-full p-1 hidden flex-col justify-end border-slate-700 z-20 pointer-events-auto">
            <div id="powerBarFill" class="w-full bg-gradient-to-t from-emerald-500 via-amber-400 to-rose-500 rounded-full h-0 transition-all duration-75"></div>
        </div>

        <!-- Back to Menu Button (In-game) -->
        <button id="btnInGameMenu" class="absolute top-3 left-3 glass-panel p-2.5 rounded-xl hidden z-20 border-slate-700 pointer-events-auto active:scale-95">
            <svg class="w-5 h-5 fill-slate-300" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </button>

        <!-- Main Menu Screen -->
        <div id="mainMenu" class="absolute inset-0 glass-panel flex flex-col justify-between p-6 z-40">
            <div class="flex justify-between items-center w-full max-w-4xl mx-auto">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 to-emerald-500 flex items-center justify-center font-black text-xl shadow-lg glow-gold">8</div>
                    <div>
                        <h1 class="text-2xl font-black text-amber-400 tracking-wider">8-BALL POOL</h1>
                        <p class="text-xs text-slate-400 font-semibold">Türkçe Bilardo Oyunu</p>
                    </div>
                </div>

                <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-2 border-amber-500/40">
                    <span class="text-amber-400 text-lg">💰</span>
                    <span id="menuMoneyText" class="text-xl font-black text-amber-300">0</span>
                </div>
            </div>

            <!-- Center Play Buttons -->
            <div class="flex flex-col gap-4 max-w-sm w-full mx-auto">
                <button id="btnPlayMatch" class="btn-action w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 font-black text-lg text-white shadow-xl glow-cyan flex items-center justify-center gap-2">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    HIZLI MAÇ (VS BOT)
                </button>

                <button id="btnOpenStore" class="btn-action w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 font-black text-lg text-white shadow-xl glow-gold flex items-center justify-center gap-2">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M19 6h-2c0-2.21-1.79-4-4-4S9 3.79 9 6H7c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 15H7V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h4v2c0 .55.45 1 1 1s1-.45 1-1V8h2v11z"/></svg>
                    ISTAKA DÜKKANI
                </button>

                <button id="btnPractice" class="btn-action w-full py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold text-slate-300 border border-slate-700 flex items-center justify-center gap-2">
                    SERBEST ANTRENMAN
                </button>
            </div>

            <!-- Footer info -->
            <div class="text-center text-xs text-slate-500 font-medium">
                Masaüstü: Fare ile nişan alıp çekerek vur. Mobil: Parmağınla nişan al ve güç çubuğunu çek.
            </div>
        </div>

        <!-- Store Modal -->
        <div id="storeModal" class="absolute inset-0 glass-panel flex flex-col justify-between p-6 z-50 hidden">
            <div class="flex justify-between items-center w-full max-w-4xl mx-auto">
                <h2 class="text-2xl font-black text-amber-400">ISTAKA DÜKKANI</h2>
                <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-2 border-amber-500/40">
                    <span class="text-amber-400 text-lg">💰</span>
                    <span id="storeMoneyText" class="text-xl font-black text-amber-300">0</span>
                </div>
            </div>

            <!-- Cue Cards Grid -->
            <div id="cueGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 max-w-4xl w-full mx-auto my-auto overflow-y-auto max-h-[70vh] p-2">
                <!-- Cues dynamically rendered here -->
            </div>

            <div class="flex justify-center w-full">
                <button id="btnCloseStore" class="btn-action px-8 py-3 rounded-2xl bg-slate-800 hover:bg-slate-700 font-black text-white border border-slate-700">
                    KAPAT
                </button>
            </div>
        </div>

        <!-- Match End Result Overlay -->
        <div id="matchEndModal" class="absolute inset-0 glass-panel flex flex-col items-center justify-center p-6 z-50 hidden">
            <div class="bg-slate-900 border border-slate-700 p-8 rounded-3xl max-w-md w-full text-center flex flex-col items-center gap-5 shadow-2xl">
                <div id="matchEndIcon" class="text-6xl">🏆</div>
                <h2 id="matchEndTitle" class="text-3xl font-black text-amber-400">KAZANDIN!</h2>
                <p id="matchEndDesc" class="text-sm text-slate-300">Harika bir atışla rakibini mağlup ettin.</p>
                <div class="bg-amber-500/10 border border-amber-500/30 px-6 py-3 rounded-2xl text-amber-300 font-bold text-lg">
                    Ödül: +$<span id="matchRewardText">100</span>
                </div>
                <button id="btnFinishMatch" class="btn-action w-full py-3.5 rounded-2xl bg-emerald-600 font-black text-white shadow-lg">
                    ANA MENÜYE DÖN
                </button>
            </div>
        </div>

    </div>

    <script>
        // Web Audio Synthesizer Engine
        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type, param = 1) {
            if (!AudioCtx) return;
            try {
                if (AudioCtx.state === 'suspended') AudioCtx.resume();
                const now = AudioCtx.currentTime;

                if (type === 'hit') {
                    // Ball-to-ball impact sound
                    const osc = AudioCtx.createOscillator();
                    const gain = AudioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(120 + Math.min(param * 10, 400), now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
                    
                    gain.gain.setValueAtTime(Math.min(param * 0.2, 0.8), now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

                    osc.connect(gain);
                    gain.connect(AudioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);

                } else if (type === 'cushion') {
                    // Cushion rebound sound
                    const osc = AudioCtx.createOscillator();
                    const gain = AudioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(90, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);

                    gain.gain.setValueAtTime(Math.min(param * 0.2, 0.6), now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

                    osc.connect(gain);
                    gain.connect(AudioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);

                } else if (type === 'pocket') {
                    // Ball potted sound
                    const osc = AudioCtx.createOscillator();
                    const gain = AudioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);

                    gain.gain.setValueAtTime(0.7, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                    osc.connect(gain);
                    gain.connect(AudioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);

                } else if (type === 'cue') {
                    // Cue strike sound
                    const osc = AudioCtx.createOscillator();
                    const gain = AudioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);

                    gain.gain.setValueAtTime(Math.min(param * 0.3, 0.9), now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                    osc.connect(gain);
                    gain.connect(AudioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);

                } else if (type === 'win') {
                    // Win melody
                    [261, 329, 392, 523].forEach((freq, idx) => {
                        const osc = AudioCtx.createOscillator();
                        const gain = AudioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        gain.gain.setValueAtTime(0.4, now + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(AudioCtx.destination);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.3);
                    });
                }
            } catch (e) {}
        }

        // Cues Mağazası Verileri
        const CUES = [
            { id: 'classic', name: 'Klasik Istaka', price: 0, power: 1.0, precision: 1.0, color: '#9a3412', tipColor: '#fde047' },
            { id: 'gold', name: 'Altın Istaka', price: 200, power: 1.25, precision: 1.2, color: '#eab308', tipColor: '#ffffff' },
            { id: 'neon', name: 'Neon Istaka', price: 500, power: 1.5, precision: 1.4, color: '#06b6d4', tipColor: '#22d3ee' },
            { id: 'dragon', name: 'Ejderha Istakası', price: 1000, power: 1.8, precision: 1.7, color: '#dc2626', tipColor: '#facc15' }
        ];

        // Global State & Storage
        const STATE = {
            money: 100,
            ownedCues: ['classic'],
            equippedCue: 'classic',
            mode: 'MENU', // MENU, MATCH, PRACTICE
            turn: 'PLAYER', // PLAYER, BOT
            playerGroup: null, // 'SOLID' (Düz 1-7), 'STRIPE' (Çizgili 9-15)
            botGroup: null,
            ballsMoving: false,
            cueAngle: 0,
            pullDistance: 0,
            isPulling: false,
            aimPos: { x: 0, y: 0 },
            table: {
                x: 0, y: 0, width: 900, height: 450,
                border: 45, radius: 12
            },
            pockets: [],
            pottedInTurn: []
        };

        // Load Saved Game
        try {
            const saved = localStorage.getItem('POOL_GAME_SAVE');
            if (saved) {
                const data = JSON.parse(saved);
                STATE.money = data.money ?? 100;
                STATE.ownedCues = data.ownedCues ?? ['classic'];
                STATE.equippedCue = data.equippedCue ?? 'classic';
            }
        } catch (e) {}

        function saveGame() {
            try {
                localStorage.setItem('POOL_GAME_SAVE', JSON.stringify({
                    money: STATE.money,
                    ownedCues: STATE.ownedCues,
                    equippedCue: STATE.equippedCue
                }));
            } catch (e) {}
        }

        // Ball Physics Engine
        class Ball {
            constructor(id, x, y, number, color, isStripe = false) {
                this.id = id;
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.radius = 11;
                this.number = number;
                this.color = color;
                this.isStripe = isStripe;
                this.isPotted = false;
            }

            update() {
                if (this.isPotted) return;

                this.x += this.vx;
                this.y += this.vy;

                // Friction
                this.vx *= 0.985;
                this.vy *= 0.985;

                // Stop small speeds
                if (Math.hypot(this.vx, this.vy) < 0.05) {
                    this.vx = 0;
                    this.vy = 0;
                }

                // Table Cushion Collisions
                const minX = STATE.table.x + STATE.table.border + this.radius;
                const maxX = STATE.table.x + STATE.table.width - STATE.table.border - this.radius;
                const minY = STATE.table.y + STATE.table.border + this.radius;
                const maxY = STATE.table.y + STATE.table.height - STATE.table.border - this.radius;

                let cushionHit = false;
                if (this.x < minX) { this.x = minX; this.vx *= -0.85; cushionHit = true; }
                if (this.x > maxX) { this.x = maxX; this.vx *= -0.85; cushionHit = true; }
                if (this.y < minY) { this.y = minY; this.vy *= -0.85; cushionHit = true; }
                if (this.y > maxY) { this.y = maxY; this.vy *= -0.85; cushionHit = true; }

                if (cushionHit) {
                    playSound('cushion', Math.hypot(this.vx, this.vy));
                }

                // Check Pockets
                STATE.pockets.forEach(pocket => {
                    const dist = Math.hypot(this.x - pocket.x, this.y - pocket.y);
                    if (dist < pocket.radius + 2) {
                        this.isPotted = true;
                        this.vx = 0;
                        this.vy = 0;
                        playSound('pocket');
                        STATE.pottedInTurn.push(this);
                    }
                });
            }

            draw(ctx) {
                if (this.isPotted) return;

                ctx.save();
                
                // Shadow
                ctx.beginPath();
                ctx.arc(this.x + 3, this.y + 3, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.fill();

                // Ball Body
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();

                // Stripe Detail
                if (this.isStripe) {
                    ctx.beginPath();
                    ctx.rect(this.x - this.radius + 1, this.y - this.radius / 2, (this.radius - 1) * 2, this.radius);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                }

                // Number Circle
                if (this.number > 0) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 4.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();

                    ctx.fillStyle = '#000000';
                    ctx.font = 'bold 6px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.number.toString(), this.x, this.y);
                }

                ctx.restore();
            }
        }

        let balls = [];

        function setupTable() {
            const canvas = document.getElementById('poolCanvas');
            const w = canvas.width;
            const h = canvas.height;

            const tableW = Math.min(w * 0.88, 920);
            const tableH = tableW / 2;
            const tableX = (w - tableW) / 2;
            const tableY = (h - tableH) / 2;

            STATE.table = {
                x: tableX,
                y: tableY,
                width: tableW,
                height: tableH,
                border: tableW * 0.05,
                radius: 11
            };

            const bx = STATE.table.x + STATE.table.border;
            const by = STATE.table.y + STATE.table.border;
            const bw = STATE.table.width - STATE.table.border * 2;
            const bh = STATE.table.height - STATE.table.border * 2;
            const pr = STATE.table.border * 0.7;

            // 6 Pockets
            STATE.pockets = [
                { x: bx, y: by, radius: pr },
                { x: bx + bw / 2, y: by - 4, radius: pr },
                { x: bx + bw, y: by, radius: pr },
                { x: bx, y: by + bh, radius: pr },
                { x: bx + bw / 2, y: by + bh + 4, radius: pr },
                { x: bx + bw, y: by + bh, radius: pr }
            ];

            initBalls();
        }

        function initBalls() {
            balls = [];
            const cueX = STATE.table.x + STATE.table.width * 0.3;
            const cueY = STATE.table.y + STATE.table.height / 2;

            // White Cue Ball
            balls.push(new Ball(0, cueX, cueY, 0, '#ffffff'));

            // Rack triangle setup (15 balls)
            const rackX = STATE.table.x + STATE.table.width * 0.72;
            const rackY = STATE.table.y + STATE.table.height / 2;
            const r = 11;
            const spacing = r * 2 + 0.5;

            const ballColors = [
                { num: 1, color: '#facc15', stripe: false },
                { num: 9, color: '#facc15', stripe: true },
                { num: 2, color: '#2563eb', stripe: false },
                { num: 10, color: '#2563eb', stripe: true },
                { num: 8, color: '#0f172a', stripe: false }, // 8-Ball Black in center
                { num: 3, color: '#dc2626', stripe: false },
                { num: 11, color: '#dc2626', stripe: true },
                { num: 4, color: '#9333ea', stripe: false },
                { num: 12, color: '#9333ea', stripe: true },
                { num: 5, color: '#f97316', stripe: false },
                { num: 13, color: '#f97316', stripe: true },
                { num: 6, color: '#16a34a', stripe: false },
                { num: 14, color: '#16a34a', stripe: true },
                { num: 7, color: '#b91c1c', stripe: false },
                { num: 15, color: '#b91c1c', stripe: true }
            ];

            let ballIdx = 0;
            for (let col = 0; col < 5; col++) {
                for (let row = 0; row <= col; row++) {
                    const bx = rackX + col * (spacing * 0.866);
                    const by = rackY - (col * spacing) / 2 + row * spacing;
                    const bData = ballColors[ballIdx % ballColors.length];
                    balls.push(new Ball(bData.num, bx, by, bData.num, bData.color, bData.stripe));
                    ballIdx++;
                }
            }
        }

        function resolveCollisions() {
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    const b1 = balls[i];
                    const b2 = balls[j];

                    if (b1.isPotted || b2.isPotted) continue;

                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < b1.radius + b2.radius) {
                        // Collision overlap separation
                        const overlap = (b1.radius + b2.radius) - dist;
                        const nx = dx / (dist || 1);
                        const ny = dy / (dist || 1);

                        b1.x -= nx * overlap * 0.5;
                        b1.y -= ny * overlap * 0.5;
                        b2.x += nx * overlap * 0.5;
                        b2.y += ny * overlap * 0.5;

                        // Elastic physics impulse exchange
                        const kx = b1.vx - b2.vx;
                        const ky = b1.vy - b2.vy;
                        const p = 2 * (nx * kx + ny * ky) / 2;

                        b1.vx -= p * nx;
                        b1.vy -= p * ny;
                        b2.vx += p * nx;
                        b2.vy += p * ny;

                        const impactSpeed = Math.hypot(p * nx, p * ny);
                        playSound('hit', impactSpeed);
                    }
                }
            }
        }

        function drawAimLine(ctx, cueBall) {
            if (STATE.turn !== 'PLAYER' || STATE.ballsMoving || cueBall.isPotted) return;

            const equippedCueObj = CUES.find(c => c.id === STATE.equippedCue) || CUES[0];
            const maxRayLength = 400 * equippedCueObj.precision;

            const cos = Math.cos(STATE.cueAngle);
            const sin = Math.sin(STATE.cueAngle);

            let closestHit = null;
            let minDistance = maxRayLength;

            // Raycast against all target balls
            balls.forEach(b => {
                if (b.number === 0 || b.isPotted) return;

                const dx = b.x - cueBall.x;
                const dy = b.y - cueBall.y;
                const dot = dx * cos + dy * sin;

                if (dot > 0) {
                    const projX = cueBall.x + cos * dot;
                    const projY = cueBall.y + sin * dot;
                    const perpDist = Math.hypot(b.x - projX, b.y - projY);

                    if (perpDist < cueBall.radius + b.radius) {
                        const d = Math.sqrt((cueBall.radius + b.radius) ** 2 - perpDist ** 2);
                        const hitDist = dot - d;
                        if (hitDist > 0 && hitDist < minDistance) {
                            minDistance = hitDist;
                            closestHit = b;
                        }
                    }
                }
            });

            ctx.save();
            ctx.setLineDash([6, 4]);
            ctx.strokeStyle = equippedCueObj.tipColor;
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(cueBall.x, cueBall.y);
            const endX = cueBall.x + cos * minDistance;
            const endY = cueBall.y + sin * minDistance;
            ctx.lineTo(endX, endY);
            ctx.stroke();

            // Hit target ball projection
            if (closestHit) {
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.arc(endX, endY, cueBall.radius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawCue(ctx, cueBall) {
            if (STATE.ballsMoving || cueBall.isPotted) return;

            const equippedCueObj = CUES.find(c => c.id === STATE.equippedCue) || CUES[0];

            ctx.save();
            ctx.translate(cueBall.x, cueBall.y);
            ctx.rotate(STATE.cueAngle + Math.PI);

            const offset = cueBall.radius + 12 + STATE.pullDistance;
            const cueLength = 260;

            // Cue Stick Shadow
            ctx.beginPath();
            ctx.rect(offset + 3, -3, cueLength, 6);
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fill();

            // Cue Stick Body
            ctx.beginPath();
            ctx.rect(offset, -4, cueLength, 8);
            ctx.fillStyle = equippedCueObj.color;
            ctx.fill();

            // Tip
            ctx.beginPath();
            ctx.rect(offset, -4, 10, 8);
            ctx.fillStyle = equippedCueObj.tipColor;
            ctx.fill();

            ctx.restore();
        }

        function drawTableGraphics(ctx) {
            const t = STATE.table;

            // Outer Wooden Border
            ctx.fillStyle = '#331800';
            ctx.beginPath();
            ctx.roundRect(t.x, t.y, t.width, t.height, 16);
            ctx.fill();

            // Inner Green Felt
            ctx.fillStyle = '#065f46';
            ctx.fillRect(t.x + t.border, t.y + t.border, t.width - t.border * 2, t.height - t.border * 2);

            // Pockets
            STATE.pockets.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#020617';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#475569';
                ctx.stroke();
            });
        }

        function processTurnLogic() {
            if (!STATE.ballsMoving && STATE.pottedInTurn.length >= 0) {
                // Check pocketed balls
                let cueBallPotted = false;
                let eightBallPotted = false;

                STATE.pottedInTurn.forEach(b => {
                    if (b.number === 0) cueBallPotted = true;
                    if (b.number === 8) eightBallPotted = true;

                    // Assign groups if unassigned
                    if (!STATE.playerGroup && b.number !== 0 && b.number !== 8) {
                        const isStripe = b.isStripe;
                        if (STATE.turn === 'PLAYER') {
                            STATE.playerGroup = isStripe ? 'STRIPE' : 'SOLID';
                            STATE.botGroup = isStripe ? 'SOLID' : 'STRIPE';
                        } else {
                            STATE.botGroup = isStripe ? 'STRIPE' : 'SOLID';
                            STATE.playerGroup = isStripe ? 'SOLID' : 'STRIPE';
                        }
                        updateGroupHUD();
                    }
                });

                // Check 8-Ball Game Over Conditions
                if (eightBallPotted) {
                    if (STATE.turn === 'PLAYER') {
                        finishGame(true);
                    } else {
                        finishGame(false);
                    }
                    return;
                }

                // Reset White Ball if potted
                if (cueBallPotted) {
                    const cueBall = balls.find(b => b.number === 0);
                    cueBall.isPotted = false;
                    cueBall.x = STATE.table.x + STATE.table.width * 0.3;
                    cueBall.y = STATE.table.y + STATE.table.height / 2;
                    cueBall.vx = 0;
                    cueBall.vy = 0;
                }

                // Switch turn if no valid ball potted
                if (STATE.pottedInTurn.length === 0 || cueBallPotted) {
                    STATE.turn = STATE.turn === 'PLAYER' ? 'BOT' : 'PLAYER';
                }

                document.getElementById('turnStatusText').innerText = STATE.turn === 'PLAYER' ? 'SENİN SIRAN' : 'BOT DÜŞÜNÜYOR...';
                STATE.pottedInTurn = [];

                // Trigger Bot Turn
                if (STATE.turn === 'BOT' && STATE.mode === 'MATCH') {
                    setTimeout(executeBotShot, 1200);
                }
            }
        }

        function executeBotShot() {
            const cueBall = balls.find(b => b.number === 0);
            if (!cueBall || cueBall.isPotted) return;

            // Target ball selection
            const targetBalls = balls.filter(b => !b.isPotted && b.number !== 0 && b.number !== 8);
            const target = targetBalls[Math.floor(Math.random() * targetBalls.length)] || balls.find(b => b.number === 8);

            if (target) {
                const angle = Math.atan2(target.y - cueBall.y, target.x - cueBall.x);
                STATE.cueAngle = angle;
                const power = 10 + Math.random() * 8;

                cueBall.vx = Math.cos(angle) * power;
                cueBall.vy = Math.sin(angle) * power;
                playSound('cue', power);
            }
        }

        function updateGroupHUD() {
            document.getElementById('playerBallGroupText').innerText = STATE.playerGroup === 'SOLID' ? 'DÜZ (1-7)' : (STATE.playerGroup === 'STRIPE' ? 'ÇİZGİLİ (9-15)' : 'SERBEST');
            document.getElementById('botBallGroupText').innerText = STATE.botGroup === 'SOLID' ? 'DÜZ (1-7)' : (STATE.botGroup === 'STRIPE' ? 'ÇİZGİLİ (9-15)' : 'SERBEST');
        }

        function finishGame(playerWon) {
            STATE.mode = 'MENU';
            document.getElementById('matchEndModal').classList.remove('hidden');

            if (playerWon) {
                document.getElementById('matchEndTitle').innerText = 'KAZANDIN!';
                document.getElementById('matchEndIcon').innerText = '🏆';
                document.getElementById('matchEndDesc').innerText = 'Tebrikler! Maçı kazanıp ödülü kaptın.';
                STATE.money += 100;
                playSound('win');
            } else {
                document.getElementById('matchEndTitle').innerText = 'KAYBETTİN!';
                document.getElementById('matchEndIcon').innerText = '💔';
                document.getElementById('matchEndDesc').innerText = '8 Numaralı top yanlış sokuldu veya bot maçı kazandı.';
            }

            saveGame();
            updateMoneyUI();
        }

        function updateMoneyUI() {
            document.getElementById('menuMoneyText').innerText = STATE.money;
            document.getElementById('storeMoneyText').innerText = STATE.money;
            document.getElementById('hudMoneyText').innerText = STATE.money;
        }

        function renderLoop() {
            const canvas = document.getElementById('poolCanvas');
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawTableGraphics(ctx);

            resolveCollisions();

            let moving = false;
            balls.forEach(b => {
                b.update();
                b.draw(ctx);
                if (Math.hypot(b.vx, b.vy) > 0) moving = true;
            });

            const cueBall = balls.find(b => b.number === 0);
            if (cueBall) {
                drawAimLine(ctx, cueBall);
                drawCue(ctx, cueBall);
            }

            if (STATE.ballsMoving && !moving) {
                STATE.ballsMoving = false;
                processTurnLogic();
            }
            if (moving) {
                STATE.ballsMoving = true;
            }

            requestAnimationFrame(renderLoop);
        }

        function renderStoreCards() {
            const cueGrid = document.getElementById('cueGrid');
            cueGrid.innerHTML = '';

            CUES.forEach(cue => {
                const isOwned = STATE.ownedCues.includes(cue.id);
                const isEquipped = STATE.equippedCue === cue.id;

                const card = document.createElement('div');
                card.className = `glass-panel p-4 rounded-2xl flex flex-col justify-between border-slate-700 ${isEquipped ? 'border-amber-400 border-2' : ''}`;
                
                card.innerHTML = `
                    <div>
                        <div class="h-4 rounded-full mb-3" style="background: ${cue.color}"></div>
                        <h3 class="font-black text-lg text-white">${cue.name}</h3>
                        <div class="text-xs text-slate-400 mt-2 space-y-1">
                            <div>Güç: <span class="text-amber-400 font-bold">${cue.power}x</span></div>
                            <div>Hassasiyet: <span class="text-cyan-400 font-bold">${cue.precision}x</span></div>
                        </div>
                    </div>
                    <div class="mt-4">
                        ${isEquipped ? `
                            <button class="w-full py-2 rounded-xl bg-amber-500/20 text-amber-300 font-bold text-xs border border-amber-400/50">SEÇİLİ</button>
                        ` : isOwned ? `
                            <button onclick="equipCue('${cue.id}')" class="btn-action w-full py-2 rounded-xl bg-emerald-600 font-bold text-xs text-white">KULLAN</button>
                        ` : `
                            <button onclick="buyCue('${cue.id}', ${cue.price})" class="btn-action w-full py-2 rounded-xl bg-amber-500 hover:bg-amber-400 font-bold text-xs text-slate-950">$${cue.price} SATIN AL</button>
                        `}
                    </div>
                `;
                cueGrid.appendChild(card);
            });
        }

        window.equipCue = function(cueId) {
            STATE.equippedCue = cueId;
            saveGame();
            renderStoreCards();
        };

        window.buyCue = function(cueId, price) {
            if (STATE.money >= price) {
                STATE.money -= price;
                STATE.ownedCues.push(cueId);
                STATE.equippedCue = cueId;
                saveGame();
                updateMoneyUI();
                renderStoreCards();
            }
        };

        function setupInputListeners() {
            const canvas = document.getElementById('poolCanvas');

            const handlePointerMove = (e) => {
                if (STATE.ballsMoving || STATE.turn !== 'PLAYER') return;
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;

                const cueBall = balls.find(b => b.number === 0);
                if (cueBall) {
                    STATE.cueAngle = Math.atan2(my - cueBall.y, mx - cueBall.x);
                }

                if (STATE.isPulling) {
                    const dist = Math.hypot(mx - STATE.aimPos.x, my - STATE.aimPos.y);
                    STATE.pullDistance = Math.min(dist, 100);
                }
            };

            const handlePointerDown = (e) => {
                if (STATE.ballsMoving || STATE.turn !== 'PLAYER') return;
                STATE.isPulling = true;
                const rect = canvas.getBoundingClientRect();
                STATE.aimPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            };

            const handlePointerUp = () => {
                if (STATE.isPulling && STATE.pullDistance > 10) {
                    const cueBall = balls.find(b => b.number === 0);
                    if (cueBall) {
                        const equippedCueObj = CUES.find(c => c.id === STATE.equippedCue) || CUES[0];
                        const power = (STATE.pullDistance / 5) * equippedCueObj.power;

                        cueBall.vx = Math.cos(STATE.cueAngle) * power;
                        cueBall.vy = Math.sin(STATE.cueAngle) * power;
                        playSound('cue', power);
                    }
                }
                STATE.isPulling = false;
                STATE.pullDistance = 0;
            };

            canvas.addEventListener('pointerdown', handlePointerDown);
            canvas.addEventListener('pointermove', handlePointerMove);
            window.addEventListener('pointerup', handlePointerUp);
        }

        window.onload = () => {
            const canvas = document.getElementById('poolCanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                setupTable();
            });

            setupTable();
            setupInputListeners();
            updateMoneyUI();

            // Menu Handlers
            document.getElementById('btnPlayMatch').onclick = () => {
                STATE.mode = 'MATCH';
                STATE.turn = 'PLAYER';
                STATE.playerGroup = null;
                STATE.botGroup = null;
                initBalls();
                document.getElementById('mainMenu').classList.add('hidden');
                document.getElementById('gameHUD').classList.remove('hidden');
                document.getElementById('btnInGameMenu').classList.remove('hidden');
                updateGroupHUD();
            };

            document.getElementById('btnPractice').onclick = () => {
                STATE.mode = 'PRACTICE';
                STATE.turn = 'PLAYER';
                initBalls();
                document.getElementById('mainMenu').classList.add('hidden');
                document.getElementById('gameHUD').classList.remove('hidden');
                document.getElementById('btnInGameMenu').classList.remove('hidden');
            };

            document.getElementById('btnOpenStore').onclick = () => {
                renderStoreCards();
                document.getElementById('storeModal').classList.remove('hidden');
            };

            document.getElementById('btnCloseStore').onclick = () => {
                document.getElementById('storeModal').classList.add('hidden');
            };

            document.getElementById('btnInGameMenu').onclick = () => {
                STATE.mode = 'MENU';
                document.getElementById('gameHUD').classList.add('hidden');
                document.getElementById('btnInGameMenu').classList.add('hidden');
                document.getElementById('mainMenu').classList.remove('hidden');
            };

            document.getElementById('btnFinishMatch').onclick = () => {
                document.getElementById('matchEndModal').classList.add('hidden');
                document.getElementById('gameHUD').classList.add('hidden');
                document.getElementById('btnInGameMenu').classList.add('hidden');
                document.getElementById('mainMenu').classList.remove('hidden');
            };

            renderLoop();
        };
    </script>
</body>
</html>
