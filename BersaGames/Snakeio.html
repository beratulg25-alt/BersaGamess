<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Klasik Yılan Oyunu (Snake)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 100vw;
            padding: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            background: #16213e;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 18px;
            font-weight: bold;
        }

        .score-box {
            color: #4ecca3;
        }

        .highscore-box {
            color: #fca311;
        }

        #gameCanvas {
            background-color: #0f3460;
            border: 4px solid #16213e;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            touch-action: none;
        }

        /* Mobil Kontroller */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 10px;
            width: 200px;
            margin-top: 10px;
        }

        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            active-bg: #0f3460;
        }

        .btn:active {
            transform: scale(0.95);
            background: #c73e54;
        }

        .btn-up { grid-column: 2; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            gap: 15px;
        }

        .restart-btn {
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Masaüstünde mobil butonları gizle/göster ayarı */
        @media (min-width: 768px) {
            .controls {
                display: none; /* Masaüstünde yön tuşları yeterlidir */
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div class="score-box">Skor: <span id="score">0</span></div>
        <div class="highscore-box">En Yüksek: <span id="highscore">0</span></div>
    </div>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="gameOverScreen" class="game-over-overlay" style="display: none;">
            <h2 style="color: #e94560; font-size: 28px;">Oyun Bitti!</h2>
            <p id="finalScore" style="font-size: 18px;"></p>
            <button class="restart-btn" onclick="resetGame()">Yeniden Başla</button>
        </div>
    </div>

    <!-- Mobil Yön Butonları -->
    <div class="controls">
        <button class="btn btn-up" onclick="changeDirection('UP')">▲</button>
        <button class="btn btn-left" onclick="changeDirection('LEFT')">◀</button>
        <button class="btn btn-right" onclick="changeDirection('RIGHT')">▶</button>
        <button class="btn btn-down" onclick="changeDirection('DOWN')">▼</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const highscoreElement = document.getElementById('highscore');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreElement = document.getElementById('finalScore');

    // Oyun Alanı Ayarları
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    // Durum Değişkenleri
    let snake = [];
    let food = { x: 0, y: 0 };
    let dx = gridSize;
    let dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_highscore') || 0;
    let gameInterval = null;
    let gameSpeed = 120;
    let isGameOver = false;
    let changingDirection = false;

    highscoreElement.innerText = highScore;

    function startGame() {
        snake = [
            { x: 10 * gridSize, y: 10 * gridSize },
            { x: 9 * gridSize, y: 10 * gridSize },
            { x: 8 * gridSize, y: 10 * gridSize }
        ];
        score = 0;
        dx = gridSize;
        dy = 0;
        gameSpeed = 120;
        isGameOver = false;
        scoreElement.innerText = score;
        gameOverScreen.style.display = 'none';
        generateFood();
        
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, gameSpeed);
    }

    function gameLoop() {
        if (isGameOver) return;
        changingDirection = false;
        clearCanvas();
        moveSnake();
        checkCollision();
        drawFood();
        drawSnake();
    }

    function clearCanvas() {
        ctx.fillStyle = '#0f3460';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
        snake.forEach((segment, index) => {
            ctx.fillStyle = index === 0 ? '#4ecca3' : '#3282b8';
            ctx.strokeStyle = '#0f3460';
            ctx.fillRect(segment.x, segment.y, gridSize - 1, gridSize - 1);
        });
    }

    function moveSnake() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        snake.unshift(head);

        // Yem yeme kontrolü
        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreElement.innerText = score;
            if (score > highScore) {
                highScore = score;
                highscoreElement.innerText = highScore;
                localStorage.setItem('snake_highscore', highScore);
            }
            generateFood();
            
            // Hızı biraz artır
            if (gameSpeed > 50) {
                clearInterval(gameInterval);
                gameSpeed -= 2;
                gameInterval = setInterval(gameLoop, gameSpeed);
            }
        } else {
            snake.pop();
        }
    }

    function generateFood() {
        food.x = Math.floor(Math.random() * tileCount) * gridSize;
        food.y = Math.floor(Math.random() * tileCount) * gridSize;

        // Yemin yılanın üstünde doğmamasını sağla
        snake.forEach(segment => {
            if (segment.x === food.x && segment.y === food.y) {
                generateFood();
            }
        });
    }

    function drawFood() {
        ctx.fillStyle = '#e94560';
        ctx.beginPath();
        ctx.arc(food.x + gridSize / 2, food.y + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
        ctx.fill();
    }

    function checkCollision() {
        const head = snake[0];

        // Duvara çarpma
        if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
            endGame();
        }

        // Kendi kuyruğuna çarpma
        for (let i = 1; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                endGame();
            }
        }
    }

    function changeDirection(dir) {
        if (changingDirection) return;

        const goingUp = dy === -gridSize;
        const goingDown = dy === gridSize;
        const goingRight = dx === gridSize;
        const goingLeft = dx === -gridSize;

        if (dir === 'LEFT' && !goingRight) { dx = -gridSize; dy = 0; changingDirection = true; }
        if (dir === 'UP' && !goingDown) { dx = 0; dy = -gridSize; changingDirection = true; }
        if (dir === 'RIGHT' && !goingLeft) { dx = gridSize; dy = 0; changingDirection = true; }
        if (dir === 'DOWN' && !goingUp) { dx = 0; dy = gridSize; changingDirection = true; }
    }

    // Klavye Kontrolleri
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') changeDirection('LEFT');
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') changeDirection('UP');
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') changeDirection('RIGHT');
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') changeDirection('DOWN');
    });

    function endGame() {
        isGameOver = true;
        clearInterval(gameInterval);
        finalScoreElement.innerText = `Skorunuz: ${score}`;
        gameOverScreen.style.display = 'flex';
    }

    function resetGame() {
        startGame();
    }

    // Oyunu Başlat
    startGame();
</script>
</body>
</html>
